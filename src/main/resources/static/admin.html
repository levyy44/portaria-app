<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração - Autorizações de Saída</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
  body { background:#F1F5F9; color:#0F172A; }
  .navbar { background:#1D4ED8; }
  .card { border:0; border-radius:14px; box-shadow:0 2px 8px rgba(15,23,42,.08); }
  .btn-salvar { background:#1D4ED8; border:0; font-weight:600; padding:.7rem 1.4rem; }
  .btn-salvar:hover { background:#1E40AF; }
  .badge-ATIVA { background:#16A34A; } .badge-EXPIRADA { background:#6B7280; } .badge-CANCELADA { background:#DC2626; }
  th { background:#E2E8F0 !important; font-size:.85rem; text-transform:uppercase; letter-spacing:.5px; }
  tr.linha-CANCELADA td { opacity:.65; }
</style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container-xl">
    <span class="navbar-brand"><i class="fa-solid fa-laptop-file me-2"></i>Autorizações de Saída</span>
    <div>
      <a class="btn btn-outline-light btn-sm" href="/portaria" target="_blank"><i class="fa-solid fa-door-open"></i> Abrir Portaria</a>
      <button class="btn btn-warning btn-sm" onclick="limparLogs()"><i class="fa-solid fa-eraser"></i> Limpar logs</button>
      <button class="btn btn-danger btn-sm" onclick="resetTudo()"><i class="fa-solid fa-trash"></i> Limpar TUDO</button>
    </div>
  </div>
</nav>

<div class="container-xl">
  <div id="alerta"></div>

  <!-- Formulário -->
  <div class="card mb-4"><div class="card-body p-4">
    <h5 class="mb-3"><i class="fa-solid fa-plus-circle text-primary"></i> Nova autorização</h5>
    <form id="form" class="row g-3 needs-validation" novalidate>
      <div class="col-md-4">
        <label class="form-label">Código da plaqueta *</label>
        <div class="input-group has-validation">
          <span class="input-group-text"><i class="fa-solid fa-barcode"></i></span>
          <input id="codigo" class="form-control" required placeholder="NB00123">
          <div class="invalid-feedback">Informe o código da plaqueta.</div>
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Nome do funcionário *</label>
        <input id="nome" class="form-control" required placeholder="João Silva">
        <div class="invalid-feedback">Informe o nome do funcionário.</div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Matrícula *</label>
        <input id="matricula" class="form-control" required placeholder="12345">
        <div class="invalid-feedback">Informe a matrícula.</div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Autorizado por *</label>
        <input id="autorizador" class="form-control" required placeholder="Maria Santos">
        <div class="invalid-feedback">Informe quem autorizou.</div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Validade (opcional)</label>
        <input id="validade" type="datetime-local" class="form-control">
        <div class="form-text">Em branco = não expira.</div>
      </div>
      <div class="col-md-4 d-flex align-items-start align-items-md-center">
        <button class="btn btn-primary btn-salvar w-100 mt-md-3" type="submit"><i class="fa-solid fa-floppy-disk"></i> Salvar autorização</button>
      </div>
    </form>
  </div></div>

  <!-- Lista -->
  <div class="card mb-5"><div class="card-body p-4">
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
      <h5 class="m-0"><i class="fa-solid fa-list text-primary"></i> Autorizações cadastradas</h5>
      <div class="d-flex gap-2">
        <input id="busca" class="form-control" placeholder="Buscar código, funcionário..." style="min-width:260px">
        <select id="filtro" class="form-select" style="width:auto">
          <option value="">Todos status</option><option>ATIVA</option><option>EXPIRADA</option><option>CANCELADA</option>
        </select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead><tr><th>Status</th><th>Plaqueta</th><th>Funcionário</th><th>Matrícula</th><th>Autorizado por</th><th>Validade</th><th class="text-end">Ações</th></tr></thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
  </div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let dados = [];

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(dt) { return dt ? new Date(dt).toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' }) : '— sem validade —'; }
function alerta(msg, tipo = 'success') {
  $('alerta').innerHTML = `<div class="alert alert-${tipo} alert-dismissible fade show">${esc(msg)}<button class="btn-close" data-bs-dismiss="alert"></button></div>`;
  setTimeout(() => $('alerta').innerHTML = '', 5000);
}

async function carregar() {
  dados = await (await fetch('/api/autorizacoes')).json();
  renderizar();
}

function renderizar() {
  const q = $('busca').value.trim().toLowerCase(), f = $('filtro').value;
  const lista = dados.filter(a =>
    (!f || a.status === f) &&
    (!q || [a.codigoPatrimonio, a.nomeFuncionario, a.matriculaFuncionario, a.autorizadoPor].join(' ').toLowerCase().includes(q)));
  $('corpo').innerHTML = lista.map(a => `
    <tr class="linha-${a.status}">
      <td><span class="badge badge-${a.status}">${a.status}</span></td>
      <td><b>${esc(a.codigoPatrimonio)}</b></td><td>${esc(a.nomeFuncionario)}</td>
      <td>${esc(a.matriculaFuncionario)}</td><td>${esc(a.autorizadoPor)}</td><td>${fmt(a.dataValidade)}</td>
      <td class="text-end">${a.status === 'ATIVA'
        ? `<button class="btn btn-outline-danger btn-sm" onclick="cancelar(${a.id})"><i class="fa-solid fa-ban"></i> Cancelar</button>` : ''}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="text-center text-muted py-4">Nenhuma autorização encontrada</td></tr>';
}
$('busca').addEventListener('input', renderizar);
$('filtro').addEventListener('change', renderizar);

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
  let validade = $('validade').value;                    // "yyyy-MM-ddTHH:mm"
  if (validade && validade.length === 16) validade += ':00';
  const r = await fetch('/api/autorizacoes', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      codigoPatrimonio: $('codigo').value, nomeFuncionario: $('nome').value,
      matriculaFuncionario: $('matricula').value, autorizadoPor: $('autorizador').value,
      dataValidade: validade || null })
  });
  if (r.ok) { alerta('Autorização salva com sucesso!'); form.reset(); form.classList.remove('was-validated'); carregar(); }
  else alerta((await r.json()).erro || 'Erro ao salvar', 'danger');
});

async function cancelar(id) {
  if (!confirm('Cancelar esta autorização?')) return;
  await fetch('/api/autorizacoes/' + id, { method: 'DELETE' });
  alerta('Autorização cancelada.', 'warning'); carregar();
}
async function limparLogs() {
  if (!confirm('Apagar todos os logs da portaria?')) return;
  await fetch('/api/logs', { method: 'DELETE' }); alerta('Logs removidos.', 'warning');
}
async function resetTudo() {
  if (!confirm('ATENÇÃO: isto apaga TODAS as autorizações e logs. Continuar?')) return;
  await fetch('/api/reset', { method: 'DELETE' }); alerta('Todos os dados foram removidos.', 'warning'); carregar();
}
carregar(); setInterval(carregar, 15000);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
