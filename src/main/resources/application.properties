server.port=8080
spring.application.name=portaria-app

# H2 em memória (dados somem ao reiniciar). Para persistir em arquivo, troque a URL por:
# jdbc:h2:file:./data/portariadb;AUTO_SERVER=TRUE
spring.datasource.url=jdbc:h2:mem:portariadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.time-zone=America/Fortaleza
